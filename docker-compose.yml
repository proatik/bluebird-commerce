services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bluebird
      POSTGRES_PASSWORD: bluebird
      POSTGRES_DB: bluebird
    ports:
      - '5432:5432'
    volumes:
      - bluebird-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bluebird -d bluebird']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  bluebird-db-data:
